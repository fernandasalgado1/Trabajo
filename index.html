<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Local MVP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- HEADER / NAVEGACIÓN -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-600">Tienda Local MVP</h1>
            <div class="flex items-center gap-4">
                <!-- Sección de Usuario Dinámica -->
                <div id="user-menu" class="flex items-center gap-2">
                    <button onclick="abrirModal('register-modal')" class="text-sm font-medium text-gray-600 hover:text-indigo-600">Registrarse</button>
                    <button onclick="abrirModal('login-modal')" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">Iniciar Sesión</button>
                </div>
                <button onclick="toggleCarrito()" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-800 transition">
                    🛒 Carrito (<span id="cart-count">0</span>)
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Filtros de Categorías -->
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
            <button onclick="filtrar('todos')" class="px-4 py-2 bg-indigo-600 text-white rounded-full text-sm font-medium">Todos</button>
            <button onclick="filtrar('ofertas')" class="px-4 py-2 bg-white border text-gray-700 hover:bg-gray-100 rounded-full text-sm font-medium">Ofertas</button>
            <button onclick="filtrar('tendencias')" class="px-4 py-2 bg-white border text-gray-700 hover:bg-gray-100 rounded-full text-sm font-medium">Tendencias</button>
        </div>

        <!-- Catálogo de Productos -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- MODAL DE REGISTRO -->
    <div id="register-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl max-w-md w-full shadow-2xl">
            <h2 class="text-lg font-bold mb-4 text-gray-800">Crear una Cuenta</h2>
            <form onsubmit="registrarUsuario(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Nombre completo</label>
                    <input type="text" id="reg-name" required class="w-full border rounded-lg p-2 mt-1 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Ana Pérez">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Correo electrónico</label>
                    <input type="email" id="reg-email" required class="w-full border rounded-lg p-2 mt-1 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="ana@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                    <input type="password" id="reg-pass" required class="w-full border rounded-lg p-2 mt-1 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="cerrarModales()" class="px-4 py-2 border rounded-lg text-gray-600">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Registrarse</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DE INICIO DE SESIÓN -->
    <div id="login-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl max-w-md w-full shadow-2xl">
            <h2 class="text-lg font-bold mb-4 text-gray-800">Iniciar Sesión</h2>
            <form onsubmit="iniciarSesion(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Correo electrónico</label>
                    <input type="email" id="login-email" required class="w-full border rounded-lg p-2 mt-1 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="ana@email.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Contraseña</label>
                    <input type="password" id="login-pass" required class="w-full border rounded-lg p-2 mt-1 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="••••••••">
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="cerrarModales()" class="px-4 py-2 border rounded-lg text-gray-600">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Ingresar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DE CHECKOUT -->
    <div id="checkout-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl max-w-md w-full shadow-2xl">
            <h2 class="text-lg font-bold mb-4 text-gray-800">Checkout Simulado</h2>
            <form onsubmit="procesarPago(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Dirección de entrega</label>
                    <input type="text" required class="w-full border rounded-lg p-2 mt-1 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Calle Falsa 123">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Método de pago online</label>
                    <select class="w-full border rounded-lg p-2 mt-1 outline-none focus:ring-2 focus:ring-indigo-500">
                        <option>Webpay Plus</option>
                        <option>PayPal</option>
                        <option>Transferencia Bancaria</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button type="button" onclick="toggleCheckout()" class="px-4 py-2 border rounded-lg text-gray-600">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">Pagar Ahora</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ASISTENTE INTELIGENTE / CHAT -->
    <div class="fixed bottom-4 right-4 z-50">
        <button onclick="toggleChat()" class="bg-green-600 hover:bg-green-700 text-white p-3 rounded-full shadow-lg transition flex items-center gap-2 font-medium text-sm">
            💬 Asistente IA
        </button>
        <div id="chat-box" class="hidden absolute bottom-14 right-0 w-80 bg-white border rounded-xl shadow-xl p-4">
            <div class="flex justify-between items-center border-b pb-2 mb-2">
                <span class="font-bold text-sm text-gray-800">Asistente Virtual IA</span>
                <button onclick="toggleChat()" class="text-gray-500 hover:text-gray-700 font-bold">✕</button>
            </div>
            <div class="h-40 overflow-y-auto text-sm space-y-2 mb-2 bg-gray-50 p-2 rounded" id="chat-messages">
                <div class="text-gray-600">¡Hola! ¿Tienes dudas sobre algún producto o despacho? Pregúntame.</div>
            </div>
            <div class="flex gap-2">
                <input type="text" id="chat-input" placeholder="Escribe tu duda..." class="border rounded-lg px-2 py-1 text-sm flex-1 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                <button onclick="enviarMensajeIA()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded-lg text-sm">Enviar</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE LÓGICA -->
    <script>
        const productos = [
            { id: 1, name: "Zapatillas Urbanas", price: 45990, category: "tendencias", image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff", description: "Zapatillas de cuero sintético con suela antideslizante." },
            { id: 2, name: "Audífonos Inalámbricos", price: 29990, category: "ofertas", image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e", description: "Cancelación de ruido activa y batería de 24 horas." },
            { id: 3, name: "Mochila Ejecutiva", price: 34990, category: "tendencias", image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62", description: "Resistente al agua con compartimento para laptop de 15.6 pulgadas." },
            { id: 4, name: "Reloj Inteligente", price: 59990, category: "ofertas", image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30", description: "Monitoreo cardíaco, contador de pasos y notificaciones." }
        ];

        let carrito = [];

        function renderProductos(filtro = 'todos') {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            const filtrados = filtro === 'todos' ? productos : productos.filter(p => p.category === filtro);
            
            filtrados.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-sm border p-4 flex flex-col justify-between hover:shadow-md transition">
                        <div>
                            <img src="${p.image}" alt="${p.name}" class="w-full h-40 object-cover rounded-lg mb-3">
                            <span class="text-xs font-semibold uppercase text-indigo-500 tracking-wider">${p.category}</span>
                            <h3 class="font-bold text-gray-800 text-lg">${p.name}</h3>
                            <p class="text-xs text-gray-500 mt-1">${p.description || ''}</p>
                            <p class="text-indigo-600 font-bold text-xl mt-2">$${p.price.toLocaleString('es-CL')}</p>
                        </div>
                        <button onclick="agregarAlCarrito(${p.id})" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm transition">
                            Agregar al Carrito
                        </button>
                    </div>
                `;
            });
        }

        function filtrar(cat) { renderProductos(cat); }

        function agregarAlCarrito(id) {
            const prod = productos.find(p => p.id === id);
            if (prod) {
                carrito.push(prod);
                document.getElementById('cart-count').innerText = carrito.length;
                alert(`¡${prod.name} agregado al carrito!`);
            }
        }

        function toggleCarrito() {
            if (carrito.length === 0) {
                alert("Tu carrito está vacío.");
            } else {
                toggleCheckout();
            }
        }

        function toggleCheckout() {
            document.getElementById('checkout-modal').classList.toggle('hidden');
        }

        function procesarPago(e) {
            e.preventDefault();
            alert("¡Compra procesada con éxito mediante pasarela segura!");
            carrito = [];
            document.getElementById('cart-count').innerText = 0;
            toggleCheckout();
        }

        // --- GESTIÓN DE USUARIOS LOCAL (LocalStorage) ---
        function abrirModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
        }

        function cerrarModales() {
            document.getElementById('register-modal').classList.add('hidden');
            document.getElementById('login-modal').classList.add('hidden');
        }

        function registrarUsuario(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;

            let usuarios = JSON.parse(localStorage.getItem('usuarios_mvp')) || [];
            
            // Validar si ya existe
            if(usuarios.some(u => u.email === email)) {
                alert("Este correo ya está registrado.");
                return;
            }

            usuarios.push({ name, email, pass });
            localStorage.setItem('usuarios_mvp', JSON.stringify(usuarios));
            alert("¡Registro exitoso! Ahora puedes iniciar sesión.");
            cerrarModales();
            abrirModal('login-modal');
        }

        function iniciarSesion(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;

            let usuarios = JSON.parse(localStorage.getItem('usuarios_mvp')) || [];
            const user = usuarios.find(u => u.email === email && u.pass === pass);

            if(user) {
                localStorage.setItem('sesion_activa', JSON.stringify(user));
                verificarSesion();
                cerrarModales();
                alert(`¡Bienvenido de nuevo, ${user.name}!`);
            } else {
                alert("Correo o contraseña incorrectos.");
            }
        }

        function cerrarSesion() {
            localStorage.removeItem('sesion_activa');
            verificarSesion();
            alert("Has cerrado sesión.");
        }

        function verificarSesion() {
            const user = JSON.parse(localStorage.getItem('sesion_activa'));
            const menu = document.getElementById('user-menu');
            
            if(user) {
                menu.innerHTML = `
                    <span class="text-sm font-medium text-gray-700">Hola, <b>${user.name}</b></span>
                    <button onclick="cerrarSesion()" class="text-xs text-red-600 hover:underline">Salir</button>
                `;
            } else {
                menu.innerHTML = `
                    <button onclick="abrirModal('register-modal')" class="text-sm font-medium text-gray-600 hover:text-indigo-600">Registrarse</button>
                    <button onclick="abrirModal('login-modal')" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">Iniciar Sesión</button>
                `;
            }
        }

        function toggleChat() {
            document.getElementById('chat-box').classList.toggle('hidden');
        }

        function enviarMensajeIA() {
            const input = document.getElementById('chat-input');
            const messages = document.getElementById('chat-messages');
            if(!input.value) return;
            
            messages.innerHTML += `<div class="text-right text-indigo-600 font-medium">Tú: ${input.value}</div>`;
            const userMsg = input.value;
            input.value = '';

            setTimeout(() => {
                let respuesta = "¡Hola! Como asistente virtual, te comento que este producto cuenta con garantía y despacho rápido.";
                if(userMsg.toLowerCase().includes('precio') || userMsg.toLowerCase().includes('descuento')) {
                    respuesta = "Tenemos un 10% de descuento pagando con Webpay.";
                }
                messages.innerHTML += `<div class="text-gray-700">IA: ${respuesta}</div>`;
                messages.scrollTop = messages.scrollHeight;
            }, 500);
        }

        // Inicializar
        renderProductos();
        verificarSesion();
    </script>
</body>
</html>
